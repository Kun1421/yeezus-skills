# 旧 VCC (yeevcc /rest/v1.0/vcc) → 新开放 API (/rest/v2.0)
# 范围：商务卡旧 VCC；消费卡/caas 迁移另册
# 权威来源：vcc 新旧接口对照.xlsx + api-index.yaml + 能力差异.md
# 状态：mapped | split | partial | gap | new_only
version: "1.1.0"
scope: commercial-legacy-vcc
no_dual_track: true  # 无双轨期：改完切新，不承诺旧新长期并存
languages_align: yop-demo

gateways:
  legacy_docs: "https://open.kun.global/docs/apis/"
  new_docs: "https://opendocs.kun.global/"
  new_sandbox: "https://sandbox.kun.global"
  new_production: "https://openapi.kun.global"

entries:
  - id: user-info
    domain: account
    old: { method: GET, path: /rest/v1.0/vcc/user-info }
    new: { method: POST, path: /rest/v2.0/caas/account/query-organization-balance }
    status: partial
    notes:
      - "只覆盖机构余额，不是商户多钱包一包返回"
      - "手续费明细另见 organization-fee-detail（new_only）"
      - "字段差异见 能力差异.md"

  - id: card-holders
    domain: cardholder
    old: { method: GET, path: /rest/v1.0/vcc/card-holders }
    new: { method: POST, path: /rest/v2.0/caas/customer/commercial/cardholders }
    status: mapped

  - id: add-card-holder
    domain: cardholder
    old: { method: POST, path: /rest/v1.0/vcc/add-card-holder }
    new: { method: POST, path: /rest/v2.0/caas/customer/commercial/add-cardholder }
    status: mapped

  - id: modify-card-holder
    domain: cardholder
    old: { method: POST, path: /rest/v1.0/vcc/modify-card-holder }
    new: { method: POST, path: /rest/v2.0/caas/customer/commercial/modify-cardholder }
    status: mapped

  - id: user-account-create
    domain: share-account
    old: { method: POST, path: /rest/v1.0/vcc/user-account/create }
    new: { method: POST, path: /rest/v2.0/api/common/userAccount/create }
    status: mapped

  - id: user-account-modify
    domain: share-account
    old: { method: POST, path: /rest/v1.0/vcc/user-account/modify }
    new: { method: POST, path: /rest/v2.0/api/common/userAccount/modify }
    status: mapped

  - id: user-account-list
    domain: share-account
    old: { method: GET, path: /rest/v1.0/vcc/user-account/list }
    new: { method: POST, path: /rest/v2.0/api/common/userAccount/list }
    status: mapped

  - id: user-account-transfer-in
    domain: share-account
    old: { method: POST, path: /rest/v1.0/vcc/user-account/transfer-in }
    new: { method: POST, path: /rest/v2.0/api/common/userAccount/accountTransferIn }
    status: mapped

  - id: user-account-transfer-out
    domain: share-account
    old: { method: POST, path: /rest/v1.0/vcc/user-account/transfer-out }
    new: { method: POST, path: /rest/v2.0/api/common/userAccount/accountTransferOut }
    status: mapped

  - id: user-account-trans-detail
    domain: share-account
    old: { method: POST, path: /rest/v1.0/vcc/user-account/trans-detail-list }
    new: { method: POST, path: /rest/v2.0/api/common/userAccount/queryTransDetail }
    status: mapped

  - id: user-account-cards
    domain: share-account
    old: { method: GET, path: /rest/v1.0/vcc/user-account/cards }
    new: { method: POST, path: /rest/v2.0/api/common/userAccount/accountCardInfo }
    status: mapped

  - id: account-transfer-in-query
    domain: share-account
    old: null
    new: { method: POST, path: /rest/v2.0/api/common/userAccount/accountTransferInQuery }
    status: new_only
    notes: ["旧无账户充值查单；迁移后资金写操作必接"]

  - id: account-transfer-out-query
    domain: share-account
    old: null
    new: { method: POST, path: /rest/v2.0/api/common/userAccount/accountTransferOutQuery }
    status: new_only
    notes: ["旧无账户转出查单；迁移后资金写操作必接"]

  - id: card-bins
    domain: product
    old: { method: GET, path: /rest/v1.0/vcc/card-bins }
    new: { method: POST, path: /rest/v2.0/api/common/cardBins }
    status: mapped

  - id: user-cards
    domain: card
    old: { method: GET, path: /rest/v1.0/vcc/user-cards }
    new: { method: POST, path: /rest/v2.0/api/common/userCards }
    status: mapped
    notes:
      - "GET→POST；机构维度分页；与 accountCardInfo（必填共享账户号）不同"
      - "字段权威：references/openapi/userCards.openapi.json"
      - "status 用 NORMAL/FREEZE/CANCEL/CANCELLING/LOCK；accountMode 1/2 同开卡"

  - id: card-open
    domain: card
    old: { method: POST, path: /rest/v1.0/vcc/card-open }
    new: { method: POST, path: /rest/v2.0/api/common/openCard }
    status: mapped

  - id: card-open-task
    domain: card
    old: { method: GET, path: /rest/v1.0/vcc/card-open-task }
    new: { method: POST, path: /rest/v2.0/api/common/openCardQuery }
    status: mapped
    notes: ["查单键 originalRequestNo = 开卡 requestNo"]

  - id: card-activate
    domain: card
    old: { method: POST, path: /rest/v1.0/vcc/card-activate }
    new: { method: POST, path: /rest/v2.0/api/cardManagement/cardActivation }
    status: mapped

  - id: card-info
    domain: card
    old: { method: GET, path: /rest/v1.0/vcc/card-info }
    new: { method: POST, path: /rest/v2.0/api/cardManagement/cardBasicInfoQuery }
    status: mapped

  - id: card-key-info
    domain: card
    old: { method: GET, path: /rest/v1.0/vcc/card-key-info }
    new: { method: POST, path: /rest/v2.0/api/cardManagement/cardInfoQuery }
    status: mapped
    notes: ["含 CVV；日志脱敏"]

  - id: card-balance
    domain: card
    old: { method: GET, path: /rest/v1.0/vcc/card-balance }
    new: { method: POST, path: /rest/v2.0/api/accountManagement/queryBalanceByCardId }
    status: mapped

  - id: card-remark
    domain: card
    old: { method: POST, path: /rest/v1.0/vcc/card-remark }
    new: { method: POST, path: /rest/v2.0/api/common/updateCardRemark }
    status: mapped
    notes:
      - "旧字段 remark → 新字段 cardRemark（覆盖写；空串/空白 trim 后清空为 null）"
      - "cardId 必填；customerId 可选但建议传以便归属校验"
      - "字段权威：references/openapi/updateCardRemark.openapi.json"

  - id: card-limit
    domain: card
    old: { method: POST, path: /rest/v1.0/vcc/card-limit }
    new: { method: POST, path: /rest/v2.0/api/common/cardLimitSettingV2 }
    status: mapped

  - id: card-recharge
    domain: fund
    old: { method: POST, path: /rest/v1.0/vcc/card-recharge-v2 }
    new: { method: POST, path: /rest/v2.0/api/cardManagement/cardRecharge }
    status: mapped

  - id: card-charge-out
    domain: fund
    old: { method: POST, path: /rest/v1.0/vcc/card-charge-out }
    new: { method: POST, path: /rest/v2.0/api/cardManagement/cardTransferOut }
    status: mapped

  - id: card-recharge-query
    domain: fund
    old: { method: GET, path: /rest/v1.0/vcc/card-recharge-query }
    new: null
    status: split
    split_to:
      - { method: POST, path: /rest/v2.0/api/cardManagement/cardRechargeStatusQuery, use: recharge }
      - { method: POST, path: /rest/v2.0/api/cardManagement/cardTransferOutStatusQuery, use: transfer_out }
    notes: ["旧一查两用；新必须按业务拆分"]

  - id: batch-card-open
    domain: batch
    old: { method: POST, path: /rest/v1.0/vcc/batch-card-open }
    new: { method: POST, path: /rest/v2.0/api/common/batchOpenCard }
    status: mapped

  - id: batch-card-open-task
    domain: batch
    old: { method: GET, path: /rest/v1.0/vcc/batch-card-open-task }
    new: { method: POST, path: /rest/v2.0/api/common/batchOpenCardTask }
    status: mapped

  - id: batch-card-cancel
    domain: batch
    old: { method: POST, path: /rest/v1.0/vcc/batch-card-cancel }
    new: { method: POST, path: /rest/v2.0/api/common/batchCancelCard }
    status: mapped

  - id: batch-card-cancel-result
    domain: batch
    old: { method: POST, path: /rest/v1.0/vcc/batch-card-cancel-result }
    new: { method: POST, path: /rest/v2.0/api/common/batchCancelCardTask }
    status: mapped

  - id: transactions
    domain: transaction
    old: { method: GET, path: /rest/v1.0/vcc/transactions }
    new: { method: POST, path: /rest/v2.0/caas/card/query-transaction }
    status: mapped
    notes: ["筛选项变少；分页字段改为 pageNum/pageSize"]

  - id: card-cancel
    domain: card
    old: { method: POST, path: /rest/v1.0/vcc/card-cancel }
    new: { method: POST, path: /rest/v2.0/api/cardManagement/cancelCard }
    status: mapped
    notes: ["旧入参含 refundCurrency、出参含退款明细；新入参无退款币种，出参以订单状态为主"]

  - id: card-freeze
    domain: card
    old: { method: POST, path: /rest/v1.0/vcc/card-freeze }
    new: { method: POST, path: /rest/v2.0/api/cardManagement/cardFreezeAndUnFreezes }
    status: mapped
    notes: ["与 card-unfreeze 合并为同一接口；本路径传 operationType=FREEZE_CARD"]

  - id: card-unfreeze
    domain: card
    old: { method: POST, path: /rest/v1.0/vcc/card-unfreeze }
    new: { method: POST, path: /rest/v2.0/api/cardManagement/cardFreezeAndUnFreezes }
    status: mapped
    notes: ["与 card-freeze 合并为同一接口；本路径传 operationType=UNFREEZE_CARD"]

  - id: card-mcc-rule
    domain: card
    old: { method: GET, path: /rest/v1.0/vcc/card-mcc-rule }
    new: { method: POST, path: /rest/v2.0/api/cardManagement/cardBasicInfoQuery }
    status: partial
    notes: ["无独立 MCC 查询接口；从卡基本信息的 mccConfig 读取"]

  - id: modify-card-mcc-rule
    domain: card
    old: { method: POST, path: /rest/v1.0/vcc/modify-card-mcc-rule }
    new: { method: POST, path: /rest/v2.0/api/cardManagement/cardMccSetting }
    status: mapped
    notes: ["ruleType→mccRuleType；status→ruleStatus；mccList 字段名不变"]

  - id: download-reconciliation-file
    domain: transaction
    old: { method: POST, path: /rest/v1.0/vcc/download-reconciliation-file }
    new: { method: POST, path: /rest/v2.0/caas/file/recon-file-download }
    status: mapped
    notes: ["日期字段 date → fileDate"]

  - id: api-config-modify
    domain: webhook
    old: { method: POST, path: /rest/v1.0/vcc/api-config/modify }
    new: { method: POST, path: /rest/v2.0/caas/config/webhook-sign-key-config }
    status: mapped
    notes: ["配置体以 signKey 为主；不再拆获取/修改两个接口"]

  - id: clear-record
    domain: transaction
    old: { method: GET, path: /rest/v1.0/vcc/clear-record }
    new: null
    status: gap
    notes: ["无商务清算分页列表；用清算 Webhook 自行落库后查询"]

  - id: card-swap
    domain: card
    old: { method: POST, path: /rest/v1.0/vcc/card-swap }
    new: null
    status: gap
    notes: ["公开文档未收录与旧一键换卡同名的接口；迁移前向平台确认，不要自造 path"]

  - id: organization-fee-detail
    domain: account
    old: null
    new: { method: POST, path: /rest/v2.0/caas/account/page-query-organization-fee-detail }
    status: new_only
    notes: ["旧无机构手续费明细分页"]

  - id: card-recharge-detail
    domain: fund
    old: null
    new: { method: POST, path: /rest/v2.0/api/cardManagement/pageQueryCardRechargeDetail }
    status: new_only
    notes: ["旧无卡充值明细分页"]

  - id: auth-transaction-webhook
    domain: webhook
    old: { method: POST, path: /rest/v1.0/vcc/auth-transaction-webhook }
    new: { kind: webhook, ref: "Webhook/Webhook对接.md#授权" }
    status: mapped

  - id: clearing-webhook
    domain: webhook
    old: { method: POST, path: /rest/v1.0/vcc/clearing-webhook }
    new: { kind: webhook, ref: "Webhook/Webhook对接.md#清算" }
    status: mapped

  - id: card-ops-webhook
    domain: webhook
    old: { method: POST, path: /rest/v1.0/vcc/card-ops-webhook }
    new: { kind: webhook, ref: "Webhook/Webhook对接.md#卡状态" }
    status: mapped

  - id: otp-webhook
    domain: webhook
    old: { method: POST, path: /rest/v1.0/vcc/otp-webhook }
    new: { kind: webhook, ref: "Webhook/Webhook对接.md#OTP" }
    status: mapped

  - id: auth-release-webhook
    domain: webhook
    old: { method: POST, path: /rest/v1.0/vcc/auth-release-webhook }
    new: { kind: webhook, ref: "Webhook/Webhook对接.md#授权释放" }
    status: mapped
